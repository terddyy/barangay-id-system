<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Login | Digital ID E-Services</title>
  <link rel="stylesheet" href="assets/coreA.css">
  <script src="apisClient.js"></script>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <h1>Digital ID E-Services</h1>
      
      <!-- Staff/Admin Login Form -->
      <div id="staffLoginForm" class="login-form">
        <p class="login-subtitle">Staff / Admin Access Only</p>
        <p class="login-description">Barangay / LGU Use Only</p>
        <input type="text" id="staffEmail" placeholder="Email or Username" value="admin@example">
        <input type="password" id="staffPassword" placeholder="Password" value="admin123">
        <button id="staffLoginBtn">Login as Staff</button>
        <p id="staffLoginStatus" class="login-status"></p>
        <div class="register-link">
          <small><a href="index.html">← Back to Resident Login</a></small>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Staff/Admin Login
    document.getElementById("staffLoginBtn").onclick = async () => {
      const email = document.getElementById("staffEmail").value.trim();
      const password = document.getElementById("staffPassword").value.trim();
      const status = document.getElementById("staffLoginStatus");
      
      if (!email || !password) {
        status.textContent = "⚠️ Please fill in all fields.";
        return;
      }
      
      status.textContent = "Checking credentials...";

      try {
        const res = await apiLogin(email, password);
        if (res.token) {
          localStorage.setItem("token", res.token);
          localStorage.setItem("user", JSON.stringify(res.user));
          localStorage.setItem("userType", "staff");
          status.textContent = "✅ Login successful!";
          setTimeout(() => window.location.href = "coreA.html", 1000);
        } else {
          status.textContent = "❌ Invalid login. Please try again.";
        }
      } catch (err) {
        console.error(err);
        status.textContent = "⚠️ Error connecting to server.";
      }
    };

    // Enter key support
    document.getElementById("staffPassword").addEventListener("keypress", (e) => {
      if (e.key === "Enter") document.getElementById("staffLoginBtn").click();
    });
  </script>

  <style>
    body {
      background: linear-gradient(135deg, #1e3a8a 0%, #312e81 100%);
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    
    .login-wrapper {
      text-align: center;
      width: 100%;
      max-width: 400px;
    }
    
    .login-card {
      background: white;
      padding: 2.5rem;
      border-radius: 1.2rem;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      width: 100%;
    }
    
    h1 {
      color: #2d3748;
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      font-weight: 700;
    }
    
    .login-subtitle {
      color: #1e3a8a;
      font-size: 1.1rem;
      margin-bottom: 0.3rem;
      font-weight: 600;
    }
    
    .login-description {
      color: #718096;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }
    
    /* Form Styles */
    .login-form {
      text-align: left;
    }
    
    input {
      display: block;
      width: 100%;
      padding: 0.75rem 1rem;
      margin: 0.7rem 0;
      border-radius: 0.5rem;
      border: 2px solid #e2e8f0;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      box-sizing: border-box;
    }
    
    input:focus {
      outline: none;
      border-color: #1e3a8a;
      box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1);
    }
    
    button {
      background: #1e3a8a;
      color: white;
      padding: 0.85rem 1rem;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      width: 100%;
      font-weight: 600;
      font-size: 1rem;
      margin-top: 0.5rem;
      transition: all 0.3s ease;
    }
    
    button:hover {
      background: #1e40af;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(30, 58, 138, 0.4);
    }
    
    button:active {
      transform: translateY(0);
    }
    
    .login-status {
      margin-top: 1rem;
      font-size: 0.9rem;
      min-height: 1.5rem;
      font-weight: 500;
    }
    
    .register-link {
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid #e2e8f0;
      text-align: center;
    }
    
    .register-link a {
      color: #1e3a8a;
      text-decoration: none;
      font-weight: 600;
    }
    
    .register-link a:hover {
      text-decoration: underline;
    }
    
    /* Responsive */
    @media (max-width: 480px) {
      .login-card {
        padding: 1.5rem;
      }
      
      h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</body>
</html>
